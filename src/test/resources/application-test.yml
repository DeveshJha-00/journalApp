jwt:
  secret: ${JWT_SECRET_KEY:01234567890123456789012345678901}

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/testdb

  redis:
    host: localhost
    port: 6379

  main:
    allow-bean-definition-overriding: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-secret}
            scope: email, profile
