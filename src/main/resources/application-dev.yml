server:
  port: ${PORT:8080}

brevo:
  api:
    key: ${BREVO_API_KEY}
  from:
    email: ${BREVO_FROM_EMAIL}
    name: ${BREVO_FROM_NAME:JournalApp}

spring:
  redis:
    host : ${REDIS_HOST:localhost}
    port : ${REDIS_PORT:6379}
    password : ${REDIS_PASSWORD:}
    timeout: ${REDIS_TIMEOUT:2s}
    lettuce:
      shutdown-timeout: 100ms

  data:
    mongodb:
      uri : ${MONGO_URI}
      database: ${MONGO_DB_NAME}
      auto-index-creation: true
      allow-circular-references: true


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

jwt:
  secret: ${JWT_SECRET_KEY}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  redis:
    cache:
      enabled: ${REDIS_CACHE_ENABLED:true}
    failure-backoff-ms: ${REDIS_FAILURE_BACKOFF_MS:60000}

# Google Gemini Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    max-tokens: ${GEMINI_MAX_TOKENS:8192}
    temperature: ${GEMINI_TEMPERATURE:0.3}
    request-timeout: ${GEMINI_REQUEST_TIMEOUT:30000}

# Report Configuration
report:
  frequency:
    days: ${REPORT_FREQUENCY_DAYS:14}
  max:
    entries: ${MAX_ENTRIES_PER_REPORT:50}
  min:
    entries: ${MIN_ENTRIES_FOR_REPORT:2}
  email:
    subject: ${REPORT_EMAIL_SUBJECT:Your Bi-weekly Mental Health Insights}

logging:
  level:
    org.springframework.boot.autoconfigure.mail: DEBUG
    # root: ERROR


